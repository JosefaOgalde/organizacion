<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>BM Cencosud · Fixture formulario receta (pruebas CRC)</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 24px auto; padding: 0 16px; }
    label { display: block; font-weight: 600; margin: 14px 0 6px; }
    input, textarea, select { width: 100%; box-sizing: border-box; padding: 8px; }
    .acciones { margin-top: 20px; display: flex; gap: 12px; }
    button { padding: 10px 16px; font-weight: 700; cursor: pointer; }
    nav a { margin-right: 12px; }
  </style>
</head>
<body>
  <nav>
    <a href="#lista">Recetas</a>
    <a href="#nueva">Nueva receta</a>
  </nav>
  <h1>Nueva receta</h1>
  <form id="form-receta">
    <label for="titulo">Título de la receta</label>
    <input id="titulo" name="titulo" type="text">

    <label for="descripcion">Descripción</label>
    <textarea id="descripcion" name="descripcion" rows="3"></textarea>

    <label for="porciones">Porciones</label>
    <input id="porciones" name="porciones" type="text">

    <label for="dificultad">Dificultad</label>
    <select id="dificultad" name="dificultad">
      <option value="">—</option>
      <option value="facil">Fácil</option>
      <option value="media">Media</option>
      <option value="dificil">Difícil</option>
    </select>

    <label for="tiempo">Tiempo total</label>
    <input id="tiempo" name="tiempo" type="text" placeholder="35 min">

    <label for="tags">Tags / categorías</label>
    <input id="tags" name="tags" type="text">

    <label for="ingredientes">Ingredientes</label>
    <textarea id="ingredientes" name="ingredientes" rows="5"></textarea>

    <label for="pasos">Pasos de preparación</label>
    <textarea id="pasos" name="pasos" rows="5"></textarea>

    <label for="meta-titulo">Meta título (SEO)</label>
    <input id="meta-titulo" name="metaTitulo" type="text">

    <label for="meta-descripcion">Meta descripción (SEO)</label>
    <textarea id="meta-descripcion" name="metaDescripcion" rows="2"></textarea>

    <div class="acciones">
      <button type="button" id="btn-borrador">Guardar borrador</button>
      <button type="button" id="btn-publicar">Publicar</button>
    </div>
  </form>
  <p id="estado" aria-live="polite"></p>
  <script>
    document.getElementById('btn-borrador').addEventListener('click', () => {
      document.getElementById('estado').textContent = 'borrador-ok';
    });
    document.getElementById('btn-publicar').addEventListener('click', () => {
      document.getElementById('estado').textContent = 'publicado-ok';
    });
  </script>
</body>
</html>
