<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Edición de tags · Recetas_Jumbo</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 520px; margin: 24px auto; }
    h1 { font-size: 1.15rem; }
    label { display: block; font-weight: 600; margin: 12px 0 6px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; min-height: 28px; }
    .chip {
      background: #e8f1ff; border: 1px solid #8ab; border-radius: 999px;
      padding: 4px 10px; font-size: 0.85rem;
    }
    .chip button { border: none; background: none; cursor: pointer; margin-left: 4px; }
    #tag-input {
      width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc;
    }
    #estado { margin-top: 14px; min-height: 1.2em; }
  </style>
</head>
<body>
  <h1>Edición de tags</h1>
  <p>Componente tags · Recetas_Jumbo | web</p>

  <label for="tag-input">Tags *</label>
  <div class="chips" id="chips" aria-label="Tags seleccionados"></div>
  <input id="tag-input" name="tags" type="text" placeholder="Escribe un tag y pulsa Enter" autocomplete="off">
  <p style="margin-top:16px">
    <button type="button" id="btn-guardar">Guardar</button>
  </p>
  <p id="estado"></p>

  <script>
    const chips = document.getElementById('chips');
    const input = document.getElementById('tag-input');
    const tags = [];

    function render() {
      chips.innerHTML = '';
      tags.forEach((t, idx) => {
        const el = document.createElement('span');
        el.className = 'chip';
        el.textContent = t;
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = '×';
        btn.addEventListener('click', () => {
          tags.splice(idx, 1);
          render();
        });
        el.appendChild(btn);
        chips.appendChild(el);
      });
    }

    function addTag(raw) {
      const t = (raw || '').trim().replace(/,$/, '');
      if (!t) return;
      if (tags.some((x) => x.toLowerCase() === t.toLowerCase())) return;
      tags.push(t);
      render();
    }

    input.addEventListener('keydown', (ev) => {
      if (ev.key === 'Enter' || ev.key === 'Tab' || ev.key === ',') {
        ev.preventDefault();
        addTag(input.value);
        input.value = '';
      }
    });

    document.getElementById('btn-guardar').addEventListener('click', () => {
      document.getElementById('estado').textContent = 'guardado:' + JSON.stringify(tags);
    });
  </script>
</body>
</html>
