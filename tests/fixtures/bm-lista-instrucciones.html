<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Edición de Lista de Instrucciones</title>
  <style>
    body { margin: 0; font-family: sans-serif; }
    .editor { margin-left: 80px; width: 640px; }
    .seccion { border: 1px solid #ccc; padding: 12px; }
    label { display: block; font-size: 14px; height: 20px; width: 180px; }
    input, textarea { display: block; width: 500px; margin-top: 4px; }
    .toolbar { margin: 8px 0; }
    .error { color: #b45309; }
  </style>
</head>
<body>
  <h1>Edición de Lista de Instrucciones</h1>
  <div class="editor">
    <p>Formulario list_Instructions</p>
    <label><input type="checkbox" checked /> Activo</label>
    <div class="seccion">
      <div>Formulario Ítem 1</div>
      <label for="titulo-lista">Título *</label>
      <input id="titulo-lista" placeholder="Dale un valor" />
      <p class="error">El dato es requerido</p>
      <p>Lista de instrucciones</p>
      <div>Formulario Ítem 1</div>
      <label for="paso-html">Paso a Paso *</label>
      <div class="toolbar">
        <label>HTML + Script <input type="checkbox" id="html-script" /></label>
        <button id="btn-source" type="button">&lt;/&gt;</button>
      </div>
      <div id="wysiwyg" contenteditable="true" style="min-height: 80px; border: 1px solid #ccc;"></div>
      <textarea id="paso-html" hidden placeholder="Dale un valor"></textarea>
    </div>
    <button type="button">+ Agregar nuevo ítem</button>
  </div>
  <script>
    function showHtml() {
      document.getElementById("wysiwyg").hidden = true;
      const ta = document.getElementById("paso-html");
      ta.hidden = false;
    }
    document.getElementById("html-script").addEventListener("change", function () {
      if (this.checked) showHtml();
    });
    document.getElementById("btn-source").addEventListener("click", showHtml);
  </script>
</body>
</html>
