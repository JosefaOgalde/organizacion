<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Edición de Lista de Instrucciones</title>
  <style>
    body { margin: 0; font-family: sans-serif; }
    .editor { margin-left: 80px; width: 640px; }
    .seccion { border: 1px solid #ccc; padding: 12px; }
    .item-paso { border: 1px dashed #bbb; margin: 8px 0; padding: 8px; }
    label { display: block; font-size: 14px; height: 20px; width: 180px; }
    input, textarea { display: block; width: 500px; margin-top: 4px; }
    .toolbar { margin: 8px 0; }
    .error { color: #b45309; }
  </style>
</head>
<body>
  <h1>Edición de Lista de Instrucciones</h1>
  <div class="editor">
    <p>Formulario list_Instructions</p>
    <label><input type="checkbox" checked /> Activo</label>
    <div class="seccion">
      <div>Formulario Ítem 1</div>
      <label for="titulo-lista">Título *</label>
      <input id="titulo-lista" placeholder="Dale un valor" />
      <p class="error">El dato es requerido</p>
      <p>Lista de instrucciones</p>
      <div id="lista-pasos">
        <div class="item-paso" data-paso="0">
          <div>Formulario Ítem 1</div>
          <label for="paso-html-0">Paso a Paso *</label>
          <div class="toolbar">
            <label>HTML + Script <input type="checkbox" class="html-script" /></label>
            <button class="btn-source" type="button">&lt;/&gt;</button>
          </div>
          <div class="wysiwyg" contenteditable="true" style="min-height: 40px; border: 1px solid #ccc;"></div>
          <textarea id="paso-html-0" class="paso-html" hidden placeholder="Dale un valor"></textarea>
        </div>
      </div>
      <button id="btn-agregar" type="button">+ Agregar nuevo ítem</button>
    </div>
  </div>
  <script>
    let nPasos = 1;
    function bindItem(root) {
      const sw = root.querySelector(".html-script");
      const btn = root.querySelector(".btn-source");
      const wys = root.querySelector(".wysiwyg");
      const ta = root.querySelector(".paso-html");
      function showHtml() {
        wys.hidden = true;
        ta.hidden = false;
      }
      sw.addEventListener("change", function () {
        if (this.checked) showHtml();
      });
      btn.addEventListener("click", showHtml);
    }
    bindItem(document.querySelector('[data-paso="0"]'));
    document.getElementById("btn-agregar").addEventListener("click", function () {
      const idx = nPasos;
      nPasos += 1;
      const wrap = document.createElement("div");
      wrap.className = "item-paso";
      wrap.setAttribute("data-paso", String(idx));
      wrap.innerHTML =
        "<div>Formulario Ítem " + (idx + 1) + "</div>" +
        '<label for="paso-html-' + idx + '">Paso a Paso *</label>' +
        '<div class="toolbar">' +
        '<label>HTML + Script <input type="checkbox" class="html-script" /></label>' +
        '<button class="btn-source" type="button">&lt;/&gt;</button>' +
        "</div>" +
        '<div class="wysiwyg" contenteditable="true" style="min-height: 40px; border: 1px solid #ccc;"></div>' +
        '<textarea id="paso-html-' + idx + '" class="paso-html" hidden placeholder="Dale un valor"></textarea>';
      document.getElementById("lista-pasos").appendChild(wrap);
      bindItem(wrap);
    });
  </script>
</body>
</html>
