<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Edición de Cabecera · Recetas_Jumbo</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 24px auto; }
    h1 { font-size: 1.2rem; }
    label { display: block; font-weight: 600; margin: 14px 0 4px; }
    input, select { width: 100%; padding: 8px; box-sizing: border-box; }
    .err { color: #b00020; font-size: 0.85rem; }
    .drop {
      border: 2px dashed #aaa; padding: 28px; text-align: center; color: #666; margin-top: 8px;
    }
  </style>
</head>
<body>
  <button type="button" id="volver">Volver</button>
  <h1>Edición de Cabecera</h1>
  <p>Formulario Header · Recetas_Jumbo | web</p>
  <form id="form-header">
    <label for="titulo">Título *</label>
    <input id="titulo" name="titulo" type="text" required>

    <label for="dificultad">Dificultad</label>
    <select id="dificultad" name="dificultad" required>
      <option value="">—</option>
      <option value="facil">Fácil</option>
      <option value="media">Media</option>
      <option value="dificil">Difícil</option>
    </select>

    <label for="duracion">Duración</label>
    <input id="duracion" name="duration" type="number" required>
    <div class="err" id="err-duracion" hidden>duration must be a 'number' type</div>

    <label for="porciones">Porciones</label>
    <input id="porciones" name="porciones" type="number" required>

    <label><input id="activo" type="checkbox" checked> Activo</label>

    <label for="imagen">Imagen</label>
    <div class="drop">Arrastra o haz click para subir una imagen...</div>
    <input id="imagen" name="imagen" type="file" accept="image/*">

    <p style="margin-top:16px">
      <button type="submit">Guardar</button>
    </p>
  </form>
  <p id="estado"></p>
  <script>
    document.getElementById('form-header').addEventListener('submit', (ev) => {
      ev.preventDefault();
      const d = document.getElementById('duracion');
      if (d.value === '' || Number.isNaN(Number(d.value))) {
        document.getElementById('err-duracion').hidden = false;
        document.getElementById('estado').textContent = 'error-duracion';
        return;
      }
      document.getElementById('err-duracion').hidden = true;
      document.getElementById('estado').textContent =
        'guardado:' + JSON.stringify({
          titulo: document.getElementById('titulo').value,
          dificultad: document.getElementById('dificultad').value,
          duracion: document.getElementById('duracion').value,
          porciones: document.getElementById('porciones').value,
          imagen: document.getElementById('imagen').files.length
        });
    });
    document.getElementById('volver').addEventListener('click', () => {
      document.getElementById('estado').textContent = 'volvio';
    });
  </script>
</body>
</html>
