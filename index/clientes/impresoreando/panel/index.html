<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Impresoreando · Panel socios</title>
  <link rel="stylesheet" href="../../../assets/portal.css?v=imp-cta2" />
  <link rel="stylesheet" href="./panel.css?v=imp-logo2" />
</head>
<body class="imp-body" data-cliente-slug="impresoreando">
  <div class="imp-top-bleed">
    <header class="imp-top imp-shell">
      <div class="imp-brand">
        <a class="imp-back" href="../">← Landing</a>
        <a class="imp-logo-link" href="../" aria-label="Impresoreando">
          <img
            class="imp-logo"
            src="../identidad/logo-impresoreando.png?v=imp-logo-oficial"
            width="320"
            height="96"
            alt="impresoreando"
          />
        </a>
        <p class="imp-sub">Panel socios 50/50 · Josefa + Nicolás · Instagram @impresoreando</p>
      </div>
      <div class="imp-top-actions">
        <span id="imp-status" class="imp-status">Cargando…</span>
        <a class="imp-btn" href="./venta/">Registrar venta</a>
        <button type="button" id="btn-guardar" class="imp-btn imp-btn--primary">Guardar online</button>
        <button type="button" id="btn-recargar" class="imp-btn">Recargar</button>
      </div>
    </header>
  </div>

  <div class="imp-tabs-bleed">
    <nav class="imp-tabs imp-shell" id="imp-tabs">
      <button type="button" data-tab="resumen" class="is-active">Resumen 50/50</button>
      <button type="button" data-tab="gastos">Gastos</button>
      <button type="button" data-tab="pedidos">Pedidos</button>
      <button type="button" data-tab="ventas">Ventas</button>
      <button type="button" data-tab="operacion">Operación / luz</button>
      <button type="button" data-tab="costos">Costos producto</button>
      <button type="button" data-tab="ads">Plan paid</button>
      <button type="button" data-tab="bitacora">Bitácora</button>
    </nav>
  </div>

  <main class="imp-main imp-shell">
    <section class="imp-panel is-active" id="tab-resumen"></section>
    <section class="imp-panel" id="tab-gastos"></section>
    <section class="imp-panel" id="tab-pedidos"></section>
    <section class="imp-panel" id="tab-ventas"></section>
    <section class="imp-panel" id="tab-operacion"></section>
    <section class="imp-panel" id="tab-costos"></section>
    <section class="imp-panel" id="tab-ads"></section>
    <section class="imp-panel" id="tab-bitacora"></section>
  </main>

  <div id="imp-modal-producto" class="imp-modal" hidden aria-hidden="true">
    <div class="imp-modal__dialog" role="dialog" aria-modal="true" aria-labelledby="imp-modal-producto-title">
      <header class="imp-modal__head">
        <h2 id="imp-modal-producto-title">Agregar producto</h2>
        <button type="button" class="imp-modal__close" id="btn-modal-producto-cerrar" aria-label="Cerrar">×</button>
      </header>
      <form class="imp-form" id="form-producto-modal">
        <p class="imp-muted">El SKU se arma solo según el nombre (ej. PCGATO001, PCPERRO001, PLMONS001). Puedes editarlo.</p>
        <label>Nombre del producto
          <input name="nombre" required placeholder="Ej. Portacompletos gato / Porta lata Monster" autofocus />
        </label>
        <label>SKU (único)
          <input name="sku" required pattern="[A-Za-z]{2,10}[0-9]{3}" title="Ej. PCGATO001" placeholder="PCGATO001" />
        </label>
        <label>Gramos filamento<input name="filamentoGramos" type="number" step="0.01" min="0" required /></label>
        <label>$ / kg filamento<input name="costoFilamentoKgClp" type="number" step="0.01" min="0" required /></label>
        <label>Horas impresión<input name="horasImpresion" type="number" step="0.01" min="0" required /></label>
        <label>Minutos pintado<input name="minutosPintado" type="number" step="0.01" min="0" required /></label>
        <label>Unidades metal<input name="unidadesMetal" type="number" step="0.01" min="0" required /></label>
        <label>Bolsas<input name="unidadesBolsa" type="number" step="0.01" min="0" required /></label>
        <label>Precio venta a público (CLP)
          <input name="precioVentaSugeridoClp" type="number" min="0" step="0.01" required />
        </label>
        <label>Notas<textarea name="notas" rows="2" placeholder="Opcional"></textarea></label>
        <div class="imp-calc-live" id="imp-modal-costo-est">Costo estimado…</div>
        <div class="imp-form-actions">
          <button type="submit" class="imp-btn imp-btn--primary">Agregar al catálogo</button>
          <button type="button" class="imp-btn" id="btn-modal-producto-cancelar">Cancelar</button>
        </div>
      </form>
    </div>
  </div>

  <div id="imp-modal-pedido" class="imp-modal" hidden aria-hidden="true">
    <div class="imp-modal__dialog imp-modal__dialog--wide" role="dialog" aria-modal="true" aria-labelledby="imp-modal-pedido-title">
      <header class="imp-modal__head">
        <h2 id="imp-modal-pedido-title">Editar pedido</h2>
        <button type="button" class="imp-modal__close" id="btn-modal-pedido-cerrar" aria-label="Cerrar">×</button>
      </header>
      <div id="imp-modal-pedido-body"></div>
    </div>
  </div>

  <div id="imp-modal-transferir" class="imp-modal" hidden aria-hidden="true">
    <div class="imp-modal__dialog" role="dialog" aria-modal="true" aria-labelledby="imp-modal-transferir-title">
      <header class="imp-modal__head">
        <h2 id="imp-modal-transferir-title">Transferir a venta</h2>
        <button type="button" class="imp-modal__close" id="btn-modal-transferir-cerrar" aria-label="Cerrar">×</button>
      </header>
      <div id="imp-modal-transferir-body"></div>
    </div>
  </div>

  <script src="./panel.js?v=imp-venta-tito"></script>
</body>
</html>
