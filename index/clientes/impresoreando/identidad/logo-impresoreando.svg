<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 160" role="img" aria-label="impresoreando">
  <title>impresoreando</title>
  <defs>
    <style>
      .imp-word {
        font-family: "Nunito", "Segoe UI Rounded", "Varela Round", "Arial Rounded MT Bold", "Segoe UI", sans-serif;
        font-weight: 800;
        font-size: 78px;
        letter-spacing: -0.5px;
        fill: #163a6b;
      }
    </style>
  </defs>

  <!-- Wordmark (p bowl covered by spool) -->
  <text class="imp-word" x="18" y="108">impresoreando</text>

  <!-- Orange dot on the i -->
  <circle cx="46.5" cy="48" r="9.5" fill="#f07a28"/>

  <!-- Cover default p bowl with white, then draw filament spool -->
  <rect x="78" y="62" width="58" height="58" fill="#ffffff"/>

  <!-- Spool body -->
  <circle cx="107" cy="92" r="28" fill="#ffffff" stroke="#163a6b" stroke-width="5"/>
  <!-- Orange filament windings -->
  <circle cx="107" cy="92" r="20" fill="none" stroke="#f07a28" stroke-width="7"/>
  <circle cx="107" cy="92" r="12" fill="none" stroke="#f07a28" stroke-width="3.5" opacity="0.85"/>
  <!-- Hub + spokes -->
  <circle cx="107" cy="92" r="7" fill="#163a6b"/>
  <g stroke="#163a6b" stroke-width="3.2" stroke-linecap="round">
    <line x1="107" y1="70" x2="107" y2="85"/>
    <line x1="107" y1="99" x2="107" y2="114"/>
    <line x1="85" y1="92" x2="100" y2="92"/>
    <line x1="114" y1="92" x2="129" y2="92"/>
    <line x1="91.5" y1="76.5" x2="101" y2="86"/>
    <line x1="113" y1="98" x2="122.5" y2="107.5"/>
    <line x1="122.5" y1="76.5" x2="113" y2="86"/>
    <line x1="101" y1="98" x2="91.5" y2="107.5"/>
  </g>
  <!-- Stem of p (ensure visible over spool cover) -->
  <rect x="84" y="58" width="11" height="62" rx="5.5" fill="#163a6b"/>

  <!-- Orange underline from spool through the rest of the word -->
  <path d="M118 128 H648" fill="none" stroke="#f07a28" stroke-width="5" stroke-linecap="round"/>

  <!-- Cat head outline at the end -->
  <g transform="translate(662 78)" fill="none" stroke="#163a6b" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- head -->
    <path d="M8 18c0-14 10-24 24-24s24 10 24 24c0 16-10 28-24 28S8 34 8 18z"/>
    <!-- ears -->
    <path d="M14 8 L20 -6 L28 6"/>
    <path d="M40 6 L48 -6 L54 8"/>
    <!-- eye + nose hint -->
    <circle cx="28" cy="16" r="2.2" fill="#163a6b" stroke="none"/>
    <path d="M36 22c2 2 6 2 8 0"/>
  </g>
  <!-- Orange whisker / motion lines -->
  <g stroke="#f07a28" stroke-width="3.2" stroke-linecap="round">
    <line x1="708" y1="90" x2="718" y2="86"/>
    <line x1="708" y1="98" x2="718" y2="98"/>
    <line x1="708" y1="106" x2="718" y2="110"/>
  </g>
</svg>
