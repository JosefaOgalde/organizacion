<svg xmlns="http://www.w3.org/2000/svg" width="1123" height="794" viewBox="0 0 1123 794" role="img" aria-labelledby="titulo desc">
  <title id="titulo">Certificado de Aprobación · Formación para Facilitadores · Desafío Latam</title>
  <desc id="desc">Maqueta con datos de ejemplo. Zonas variables: nombre, formación, fecha e identificador.</desc>
  <defs>
    <style>
      .lbl { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 600; letter-spacing: 0.28em; fill: #729E2E; }
      .formacion { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 500; fill: #0F2E81; }
      .brand { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 800; fill: #0F2E81; letter-spacing: 0.18em; }
      .lead { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 400; fill: #0F2E81; fill-opacity: 0.62; }
      .nombre { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 800; fill: #0F2E81; }
      .cuerpo { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 400; fill: #0F2E81; fill-opacity: 0.82; }
      .micro { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 600; letter-spacing: 0.16em; fill: #729E2E; }
      .dato { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 600; fill: #0F2E81; }
      .pie { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 400; fill: #0F2E81; fill-opacity: 0.45; }
    </style>
  </defs>

  <rect width="1123" height="794" fill="#FFFFFF"/>

  <!-- Barra de acento  no invade campos variables -->
  <rect x="0" y="0" width="10" height="794" fill="#729E2E"/>
  <rect x="10" y="0" width="6" height="794" fill="#FFCD56"/>

  <!-- Esquinas técnicas -->
  <path d="M48 48h52M48 48v52" fill="none" stroke="#0F2E81" stroke-width="2"/>
  <path d="M1075 48h-52M1075 48v52" fill="none" stroke="#0F2E81" stroke-width="2"/>
  <path d="M48 746h52M48 746v-52" fill="none" stroke="#0F2E81" stroke-width="2"/>
  <path d="M1075 746h-52M1075 746v-52" fill="none" stroke="#0F2E81" stroke-width="2"/>

  <!-- Motivo geométrico (esquina superior derecha, fuera de texto) -->
  <g transform="translate(980,86)" fill="none" stroke="#0F2E81" stroke-width="1.5" opacity="0.35">
    <rect x="0" y="0" width="14" height="14"/>
    <rect x="22" y="0" width="14" height="14"/>
    <rect x="44" y="0" width="14" height="14"/>
    <rect x="22" y="22" width="14" height="14" fill="#729E2E" stroke="none" opacity="1"/>
  </g>
  <rect x="1002" y="108" width="14" height="14" fill="#729E2E" opacity="0.9"/>
  <rect x="1024" y="86" width="14" height="14" fill="#FFCD56"/>

  <text class="lbl" x="561.5" y="92" font-size="12" text-anchor="middle">CERTIFICADO DE APROBACIÓN</text>

  <!-- VARIABLE: nombre de la formación -->
  <text id="campo-formacion" class="formacion" x="561.5" y="138" font-size="26" text-anchor="middle">Formación para Facilitadores</text>

  <text class="brand" x="561.5" y="186" font-size="15" text-anchor="middle">DESAFÍO LATAM</text>
  <rect x="521.5" y="202" width="80" height="3" fill="#729E2E"/>

  <text class="lead" x="561.5" y="246" font-size="16" text-anchor="middle">Certifica que</text>

  <!-- VARIABLE: nombre  zona 80×260 a 1043×400 -->
  <text id="campo-nombre" class="nombre" x="561.5" y="330" font-size="40" text-anchor="middle">María Fernanda González Sepúlveda</text>
  <rect x="421.5" y="352" width="280" height="3" fill="#729E2E"/>

  <text class="cuerpo" x="561.5" y="412" font-size="15" text-anchor="middle">ha aprobado satisfactoriamente el proceso de formación para Facilitador/a Bootcamp,</text>
  <text class="cuerpo" x="561.5" y="436" font-size="15" text-anchor="middle">cumpliendo los criterios formativos y de evaluación establecidos por la Academia.</text>

  <line x1="180" y1="620" x2="943" y2="620" stroke="#0F2E81" stroke-opacity="0.14" stroke-width="1"/>

  <text class="micro" x="280" y="658" font-size="10" text-anchor="middle">FECHA DE EMISIÓN</text>
  <text id="campo-fecha" class="dato" x="280" y="686" font-size="16" text-anchor="middle">1 de septiembre de 2026</text>

  <text class="micro" x="843" y="658" font-size="10" text-anchor="middle">CERTIFICADO N°</text>
  <text id="campo-id" class="dato" x="843" y="686" font-size="16" text-anchor="middle">41773</text>

  <text class="pie" x="561.5" y="748" font-size="11" text-anchor="middle">Academia Desafío Latam · Formación docente</text>
</svg>
