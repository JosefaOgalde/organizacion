<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Making Of — Revisión de landings</title>
  <style>
    :root {
      --bg: #f3efe6;
      --panel: #fffdf8;
      --ink: #1a1a1a;
      --muted: #5c6660;
      --green: #0e2b22;
      --green-2: #2c7526;
      --line: #d9d2c4;
      --accent: #eff6ea;
      --warn: #fff4df;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      color: var(--ink);
      background: linear-gradient(180deg, #e8f0e4 0%, var(--bg) 40%);
    }
    .app {
      display: grid;
      grid-template-columns: 260px 1fr;
      height: 100vh;
    }
    aside {
      background: var(--green);
      color: #eff6ea;
      overflow: auto;
      padding: 16px 12px 24px;
      border-right: 1px solid #0a1f18;
    }
    aside h1 {
      font-size: 14px;
      margin: 0 0 4px;
      letter-spacing: .02em;
    }
    aside .sub {
      font-size: 11px;
      opacity: .75;
      margin-bottom: 14px;
      line-height: 1.35;
    }
    .group-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .08em;
      opacity: .55;
      margin: 14px 8px 6px;
    }
    .nav-item {
      display: block;
      width: 100%;
      text-align: left;
      border: 0;
      background: transparent;
      color: inherit;
      padding: 8px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
    }
    .nav-item:hover { background: rgba(255,255,255,.08); }
    .nav-item.active { background: var(--green-2); color: #fff; }
    .nav-item .url {
      display: block;
      font-size: 10px;
      opacity: .65;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    main {
      display: grid;
      grid-template-rows: auto 1fr;
      min-width: 0;
      min-height: 0;
    }
    .topbar {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: rgba(255,255,255,.7);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(6px);
    }
    .topbar h2 {
      margin: 0;
      font-size: 16px;
    }
    .topbar a {
      color: var(--green-2);
      font-size: 12px;
    }
    .topbar-meta {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .version-switch {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center;
    }
    .version-switch label {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .06em;
    }
    .version-switch select {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 12px;
      background: #fff;
      color: var(--ink);
    }
    .version-badge {
      display: inline-block;
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--accent);
      color: var(--green);
      margin-left: 6px;
      vertical-align: middle;
    }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .actions button, .actions label.btn {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 12px;
      cursor: pointer;
    }
    .actions button.primary {
      background: var(--green);
      color: #fff;
      border-color: var(--green);
    }
    .workspace {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 0;
      min-height: 0;
      height: 100%;
    }
    .shot-pane, .edit-pane {
      min-height: 0;
      overflow: auto;
      padding: 14px;
    }
    .shot-pane {
      border-right: 1px solid var(--line);
      background: #ebe6db;
    }
    .shot-wrap {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(14,43,34,.08);
    }
    .shot-wrap img,
    .shot-wrap iframe {
      display: block;
      width: 100%;
      height: auto;
      border: 0;
      background: #fff;
    }
    .shot-wrap iframe {
      min-height: 72vh;
      height: 72vh;
    }
    .shot-note {
      font-size: 11px;
      color: var(--muted);
      margin: 0 0 8px;
      line-height: 1.35;
    }
    .edit-pane {
      background: var(--panel);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .field label {
      display: block;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--muted);
      margin-bottom: 6px;
    }
    textarea {
      width: 100%;
      min-height: 280px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px;
      font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      background: #fff;
      color: var(--ink);
    }
    textarea.comments {
      min-height: 160px;
      background: var(--warn);
    }
    .hint {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.4;
    }
    .status {
      font-size: 11px;
      color: var(--green-2);
      min-height: 14px;
    }
    .empty {
      padding: 40px;
      color: var(--muted);
    }
    @media (max-width: 980px) {
      .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; height: auto; min-height: 100vh; }
      aside { max-height: 220px; }
      .workspace { grid-template-columns: 1fr; }
      .shot-pane { border-right: 0; border-bottom: 1px solid var(--line); max-height: 55vh; }
      main { height: auto; }
      .workspace { height: auto; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <h1>Landings Making Of</h1>
      <div class="sub">Captura a la izquierda · texto editable y comentarios a la derecha. Se puede abrir el HTML directo (sin servidor). Los cambios se guardan en este navegador.</div>
      <div id="nav"></div>
    </aside>
    <main>
      <div class="topbar">
        <div class="topbar-meta">
          <h2 id="title"><span id="pageTitle">Cargando…</span><span class="version-badge" id="versionBadge"></span></h2>
          <div class="version-switch">
            <label for="versionSelect">Versión</label>
            <select id="versionSelect" aria-label="Versión de textos">
              <option value="v1">V1 · Sitio actual</option>
              <option value="v2">V2 · Beta 2026 (mkof-beta-2026)</option>
            </select>
          </div>
          <a id="liveLink" href="#" target="_blank" rel="noopener">Abrir en vivo</a>
        </div>
        <div class="actions">
          <button type="button" id="btnResetPage">Restablecer página</button>
          <button type="button" id="btnExport">Exportar JSON</button>
          <label class="btn">Importar JSON<input type="file" id="importFile" accept="application/json,.json" hidden /></label>
          <button type="button" class="primary" id="btnSave">Guardar</button>
        </div>
      </div>
      <div class="workspace" id="workspace">
        <div class="empty">Elige una landing en el menú.</div>
      </div>
    </main>
  </div>

  <script src="data.js"></script>
  <script src="data-v2.js"></script>
  <script>
    const VERSION_KEY = 'mkof-landings-revision-version';
    let currentVersion = 'v1';
    let pages = [];
    let currentId = null;
    let saveTimer = null;

    const $ = (sel) => document.querySelector(sel);

    function storageKey() {
      return `mkof-landings-revision-${currentVersion}`;
    }

    function loadStore() {
      try { return JSON.parse(localStorage.getItem(storageKey()) || '{}'); }
      catch { return {}; }
    }
    function writeStore(store) {
      localStorage.setItem(storageKey(), JSON.stringify(store));
    }

    function getDatasets() {
      return {
        v1: Array.isArray(window.MKOF_LANDINGS) ? window.MKOF_LANDINGS : [],
        v2: Array.isArray(window.MKOF_LANDINGS_V2) ? window.MKOF_LANDINGS_V2 : [],
      };
    }

    function loadPagesForVersion(version) {
      const datasets = getDatasets();
      return datasets[version] || [];
    }

    function urlLabel(url) {
      return String(url || '')
        .replace('https://grupomakingof.com/mkof-beta-2026', '/mkof-beta-2026')
        .replace('https://grupomakingof.com', '');
    }

    function updateVersionBadge() {
      const badge = $('#versionBadge');
      if (!badge) return;
      badge.textContent = currentVersion === 'v2' ? 'Beta 2026' : 'Sitio actual';
    }
    function getPageEdits(id) {
      return loadStore()[id] || {};
    }
    function setPageEdits(id, patch) {
      const store = loadStore();
      store[id] = { ...(store[id] || {}), ...patch, updatedAt: new Date().toISOString() };
      writeStore(store);
    }

    function buildNav() {
      const nav = $('#nav');
      nav.innerHTML = '';
      let lastGroup = null;
      pages.forEach((p) => {
        if (p.group !== lastGroup) {
          const g = document.createElement('div');
          g.className = 'group-label';
          g.textContent = p.group;
          nav.appendChild(g);
          lastGroup = p.group;
        }
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'nav-item' + (p.id === currentId ? ' active' : '');
        btn.dataset.id = p.id;
        btn.innerHTML = `<span>${p.title}</span><span class="url">${urlLabel(p.url)}</span>`;
        btn.addEventListener('click', () => selectPage(p.id));
        nav.appendChild(btn);
      });
    }

    function selectPage(id, opts = {}) {
      const { persistBefore = true } = opts;
      if (persistBefore) persistCurrentFields();
      currentId = id;
      const page = pages.find((p) => p.id === id);
      if (!page) return;
      buildNav();
      const edits = getPageEdits(id);
      const text = edits.text != null ? edits.text : page.text;
      const comments = edits.comments != null ? edits.comments : (page.comments || '');

      $('#pageTitle').textContent = page.title;
      updateVersionBadge();
      const link = $('#liveLink');
      link.href = page.url;
      link.textContent = page.url;

      const versionLabel = currentVersion === 'v2' ? 'Beta 2026' : 'Sitio actual';
      const useLivePreview = page.preview === 'live' || currentVersion === 'v2';
      const shotHtml = useLivePreview
        ? `<p class="shot-note">Vista del beta en vivo. Si no carga aquí, usa <b>Abrir en vivo</b>.</p>
           <div class="shot-wrap">
             <iframe src="${page.url}" title="Beta ${page.title}" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
           </div>`
        : `<div class="shot-wrap">
             <img src="${page.shot}" alt="Captura de ${page.title}" loading="lazy" />
           </div>`;

      $('#workspace').innerHTML = `
        <section class="shot-pane">
          ${shotHtml}
        </section>
        <section class="edit-pane">
          <div class="hint">Textos de <b>${versionLabel}</b> · edita o deja comentarios. Usa <b>Guardar</b> o espera el autoguardado.</div>
          <div class="field">
            <label for="textArea">Texto / copy (editable)</label>
            <textarea id="textArea" spellcheck="true">${escapeHtml(text)}</textarea>
          </div>
          <div class="field">
            <label for="commentsArea">Comentarios</label>
            <textarea id="commentsArea" class="comments" placeholder="Notas, dudas, cambios pedidos…">${escapeHtml(comments)}</textarea>
          </div>
          <div class="status" id="status"></div>
        </section>
      `;

      $('#textArea').addEventListener('input', scheduleSave);
      $('#commentsArea').addEventListener('input', scheduleSave);
    }

    function escapeHtml(s) {
      return String(s || '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;');
    }

    function persistCurrentFields() {
      if (!currentId) return;
      const textEl = $('#textArea');
      const comEl = $('#commentsArea');
      if (!textEl || !comEl) return;
      setPageEdits(currentId, { text: textEl.value, comments: comEl.value });
    }

    function scheduleSave() {
      const status = $('#status');
      if (status) status.textContent = 'Cambios sin guardar…';
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => {
        persistCurrentFields();
        if (status) status.textContent = 'Guardado en este navegador · ' + new Date().toLocaleTimeString();
      }, 400);
    }

    function exportJson() {
      persistCurrentFields();
      const store = loadStore();
      const payload = pages.map((p) => ({
        id: p.id,
        title: p.title,
        url: p.url,
        group: p.group,
        text: store[p.id]?.text != null ? store[p.id].text : p.text,
        comments: store[p.id]?.comments != null ? store[p.id].comments : '',
        updatedAt: store[p.id]?.updatedAt || null,
      }));
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `mkof-landings-revision-${currentVersion}.json`;
      a.click();
      URL.revokeObjectURL(a.href);
    }

    function importJson(file) {
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const arr = JSON.parse(reader.result);
          const store = loadStore();
          arr.forEach((row) => {
            if (!row.id) return;
            store[row.id] = {
              text: row.text ?? '',
              comments: row.comments ?? '',
              updatedAt: row.updatedAt || new Date().toISOString(),
            };
          });
          writeStore(store);
          if (currentId) selectPage(currentId);
          alert('Importación lista.');
        } catch (e) {
          alert('No se pudo importar el JSON: ' + e.message);
        }
      };
      reader.readAsText(file);
    }

    function resetPage() {
      if (!currentId) return;
      const label = currentVersion === 'v2' ? 'Beta 2026' : 'sitio actual';
      if (!confirm(`¿Restablecer texto y comentarios de esta página al original de ${label}?`)) return;
      const store = loadStore();
      delete store[currentId];
      writeStore(store);
      selectPage(currentId, { persistBefore: false });
    }

    $('#btnSave').addEventListener('click', () => {
      persistCurrentFields();
      const status = $('#status');
      if (status) status.textContent = 'Guardado · ' + new Date().toLocaleTimeString();
    });
    $('#btnExport').addEventListener('click', exportJson);
    $('#btnResetPage').addEventListener('click', resetPage);
    $('#importFile').addEventListener('change', (e) => {
      const f = e.target.files?.[0];
      if (f) importJson(f);
      e.target.value = '';
    });

    function switchVersion(nextVersion) {
      if (nextVersion === currentVersion) return;
      persistCurrentFields();
      currentVersion = nextVersion;
      localStorage.setItem(VERSION_KEY, currentVersion);
      pages = loadPagesForVersion(currentVersion);
      if (!pages.length) {
        $('#pageTitle').textContent = 'No se pudo cargar la versión';
        updateVersionBadge();
        $('#workspace').innerHTML = `<div class="empty">Falta <code>data${currentVersion === 'v2' ? '-v2' : ''}.js</code> junto a este HTML.</div>`;
        return;
      }
      const keepId = currentId && pages.some((p) => p.id === currentId) ? currentId : pages[0].id;
      buildNav();
      selectPage(keepId, { persistBefore: false });
    }

    $('#versionSelect').addEventListener('change', (e) => {
      switchVersion(e.target.value);
    });

    function boot() {
      currentVersion = localStorage.getItem(VERSION_KEY) || 'v1';
      if (!['v1', 'v2'].includes(currentVersion)) currentVersion = 'v1';
      $('#versionSelect').value = currentVersion;
      pages = loadPagesForVersion(currentVersion);
      if (!pages.length) {
        $('#pageTitle').textContent = 'No se pudo cargar data.js';
        updateVersionBadge();
        $('#workspace').innerHTML = `<div class="empty">Falta <code>data.js</code> y/o <code>data-v2.js</code> junto a este HTML.</div>`;
        return;
      }
      buildNav();
      selectPage(pages[0].id, { persistBefore: false });
    }
    boot();
  </script>
</body>
</html>
