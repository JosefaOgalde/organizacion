<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Banner · Nav2 · stack caras-mesh</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700;800&family=Lato:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../home-1b-alt.css">
  <link rel="stylesheet" href="../home-1b-nav2.css">
  <link rel="stylesheet" href="../hero-banner-type.css">
  <style>
    html, body { margin: 0; }
    body { overflow-x: hidden; }
    /* sin sticky header del home: solo el banner */
    .site-header, .top, .nav4, .v1-nav { display: none !important; }
  </style>
</head>
<body class="home-alt home-nav2">
<!-- HERO Nav2 · Making Of contenido · capas con iconos (sin textos) -->
    <section class="hero hero--v2 band band--cream" id="hero">
      <div class="hero-v2__grid">
        <div class="hero-v2__copy">
          <p class="t-label">
            <span class="dot" aria-hidden="true"></span>
            Marketing digital · Santiago · Desde 2014
          </p>

          <!-- V3 · Making Of + rail + partner medium -->
          <div class="hero-diag hero-diag--v3">
            <h1 class="hero-line-brand">Making Of,</h1>
            <span class="hero-rail" aria-hidden="true"></span>
            <div class="hero-diag__col">
              <p class="hero-line-partner">your next business partner</p>
              <p class="hero-bajada">
                Somos el partner estratégico de marcas que necesitan crecer con datos,
                creatividad y tecnología. Entendemos el negocio antes de proponer el canal.
              </p>
            </div>
          </div>

          <a class="btn" href="#contacto">Cuéntanos tu proyecto →</a>
        </div>

        <aside class="hero-v2__stack" aria-label="Malla de caras Making Of">
          <div class="stack-card stack-card--back" aria-hidden="true"></div>
          <div class="stack-card stack-card--mid" aria-hidden="true"></div>
          <div class="stack-card stack-card--front">
            <img class="stack-faces" src="../assets/caras-mesh.svg" alt="" width="520" height="420">
          </div>
        </aside>
      </div>
    </section>
</body>
</html>
