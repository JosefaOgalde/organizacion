<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Banner · Nav2b · stack caras-mesh + tipografía chips</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700;800&family=Lato:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../home-1b-alt.css">
  <link rel="stylesheet" href="../home-1b-nav2.css">
  <link rel="stylesheet" href="../home-1b-nav2b.css">
  <link rel="stylesheet" href="../hero-banner-type.css">
  <style>
    html, body { margin: 0; }
    body { overflow-x: hidden; }
    /* sin sticky header del home: solo el banner */
    .site-header, .top, .nav4, .v1-nav { display: none !important; }
  </style>
</head>
<body class="home-alt home-nav2 home-nav2b">
<!-- HERO Nav2b · otra tipografía: Making Of + partner en columna numerada -->
    <section class="hero hero--v2 band band--cream" id="hero">
      <div class="hero-v2__grid">
        <div class="hero-v2__copy hero-v2b__copy">
          <p class="t-label">
            <span class="dot" aria-hidden="true"></span>
            Marketing digital · Santiago · Desde 2014
          </p>

          
          <div class="hero-type hero-type--chips">
            <h1 class="t-display">Making Of,</h1>
            <ul class="chip-row" aria-label="your next business partner">
              <li>your next</li>
              <li>business</li>
              <li>partner</li>
            </ul>
          </div>

          <p class="t-lead hero-lead-em">
            Somos el partner estratégico de marcas que necesitan crecer con
            <em>datos</em>, <em>creatividad</em> y <em>tecnología</em>.
            Entendemos el negocio antes de proponer el canal.
          </p>

          <a class="btn" href="#contacto">Cuéntanos tu proyecto →</a>
        </div>

        <aside class="hero-v2__stack" aria-label="Malla de caras Making Of">
          <div class="stack-card stack-card--back" aria-hidden="true"></div>
          <div class="stack-card stack-card--mid" aria-hidden="true"></div>
          <div class="stack-card stack-card--front">
            <img class="stack-faces" src="../assets/caras-mesh.svg" alt="" width="520" height="420">
          </div>
        </aside>
      </div>
    </section>
</body>
</html>
