<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Banner · 1B · caras float + orbs + pills</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700;800&family=Lato:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../home-1b.css">
  <link rel="stylesheet" href="../hero-banner-type.css">
  <style>
    html, body { margin: 0; }
    body { overflow-x: hidden; }
    /* sin sticky header del home: solo el banner */
    .site-header, .top, .nav4, .v1-nav { display: none !important; }
  </style>
</head>
<body class="home-1b">
<!-- HERO · continuo arena -->
    <section class="hero band band--cream">
      <div class="hero__copy">
        <p class="eyebrow">
          <span class="eyebrow__dot" aria-hidden="true"></span>
          01 — Marketing digital · Santiago · Desde 2014
        </p>

        <div class="hero-type hero-type--stack">
          <h1 class="hero__title">
            <span class="t-display">Making Of,</span>
            <span class="t-partner">your next<br>business<br>partner</span>
          </h1>
        </div>

        <p class="t-lead hero-lead-em">
          Somos el partner estratégico de marcas que necesitan crecer con
          <em>datos</em>, <em>creatividad</em> y <em>tecnología</em>.
          Entendemos el negocio antes de proponer el canal.
        </p>

        <div class="hero__foot">
          <a class="btn btn--dark" href="#contacto">Cuéntanos tu proyecto <span aria-hidden="true">→</span></a>
        </div>
      </div>

      <aside class="hero__media" aria-label="Composición visual">
        <div class="hero__mesh" aria-hidden="true"></div>
        <div class="hero__orb hero__orb--a" aria-hidden="true"></div>
        <div class="hero__orb hero__orb--b" aria-hidden="true"></div>

        <!-- Caras / fotos / iconos como elementos de estilo -->
        <div class="hero__stack">
          <figure class="media-tile media-tile--photo">
            <span class="media-tile__label">Foto — equipo en oficina, luz natural</span>
          </figure>
          <div class="face-row" aria-hidden="true">
            <span class="face face--1"></span>
            <span class="face face--2"></span>
            <span class="face face--3"></span>
            <span class="face face--4"></span>
            <span class="icon-chip">SEO</span>
            <span class="icon-chip">Paid</span>
          </div>
          <div class="float-pill float-pill--a">Google Partner</div>
          <div class="float-pill float-pill--b">▲ 120+ marcas</div>
        </div>
      </aside>
    </section>
</body>
</html>
