<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Banner · Nav3 · panel caras-mesh</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700;800&family=Lato:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../home-1b-alt.css">
  <link rel="stylesheet" href="../home-1b-nav3.css">
  <link rel="stylesheet" href="../hero-banner-type.css">
  <style>
    html, body { margin: 0; }
    body { overflow-x: hidden; }
    /* sin sticky header del home: solo el banner */
    .site-header, .top, .nav4, .v1-nav { display: none !important; }
  </style>
</head>
<body class="home-alt home-nav3">
<!-- HERO Nav3 · fondo arena (distinto a cream de Alt/Nav2) · tipografía + caras -->
    <section class="hero hero--v3" id="hero">
      <div class="hero-v3__grid">
        <div class="hero-v3__copy">
          <p class="t-label">
            <span class="dot" aria-hidden="true"></span>
            Marketing digital · Santiago · Desde 2014
          </p>

          <!-- V1 · Making Of + partner light subrayado -->
          <div class="hero-diag hero-diag--v1">
            <h1>
              <span class="hero-line-brand">Making Of,</span>
              <span class="hero-line-partner">your next business partner</span>
            </h1>
            <p class="hero-bajada">
              Somos el partner estratégico de marcas que necesitan crecer con datos,
              creatividad y tecnología. Entendemos el negocio antes de proponer el canal.
            </p>
          </div>

          <a class="btn" href="#contacto">Cuéntanos tu proyecto →</a>
        </div>

        <aside class="hero-v3__visual" aria-label="Malla de caras Making Of">
          <div class="hero-v3__panel">
            <img class="hero-v3__faces" src="../assets/caras-mesh.svg" alt="" width="520" height="420">
          </div>
        </aside>
      </div>
    </section>
</body>
</html>
