<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MKOF · caras banner v4 (colores lima)</title>
<style>
:root{
  --dark:#0E2B22;
  --green:#8FC93A;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:var(--dark);font-family:'Instrument Sans',Helvetica,Arial,sans-serif;}
body{display:flex;flex-direction:column;}
.bar{
  flex:0 0 auto;
  display:flex;flex-wrap:wrap;align-items:center;gap:12px;
  padding:12px 16px;
  background:#0a1f18;
  color:#F7F3E7;
  font-size:13px;
}
.bar strong{color:var(--green);}
.bar button,.bar a{
  appearance:none;border:0;border-radius:999px;
  padding:8px 16px;font-weight:700;font-size:13px;cursor:pointer;
  background:var(--green);color:var(--dark);text-decoration:none;
}
.bar a.ghost{background:transparent;color:#F7F3E7;border:1px solid rgba(247,243,231,.25);}
.stage{flex:1;position:relative;overflow:hidden;background:var(--dark);min-height:0;}
.hero-right{
  position:absolute;inset:0;
  background:var(--dark);
  overflow:hidden;
}
.hero-right::after{
  content:'';
  position:absolute;inset:0;z-index:2;pointer-events:none;
  background:
    radial-gradient(ellipse 55% 48% at 18% 100%, rgba(14,43,34,0.95) 0%, rgba(14,43,34,0.55) 35%, transparent 70%),
    linear-gradient(180deg, transparent 58%, rgba(14,43,34,0.45) 78%, var(--dark) 100%);
}
.hero-video{
  width:100%;height:100%;
  object-fit:cover;
  object-position:50% 48%;
  display:block;
  background:var(--dark);
  mix-blend-mode:screen;
  filter:invert(1) sepia(1) saturate(5.2) hue-rotate(52deg) brightness(1.22) contrast(1.08);
  transform:scale(1.08);
  transform-origin:center center;
}
canvas{display:none;}
.note{opacity:.7;font-size:12px;}
</style>
</head>
<body>
  <div class="bar">
    <strong>Solo caras · colores Home v4</strong>
    <span>fondo #0E2B22 · lima #8FC93A</span>
    <button type="button" id="btnPng">Descargar PNG de este frame</button>
    <a class="ghost" href="COMPARTIR-GMO-Home-v4.html">Abrir home v4 completa</a>
    <span class="note" id="status">El video es el mismo de grupomakingof.com; el color lima es filtro CSS de la v4.</span>
  </div>
  <div class="stage">
    <div class="hero-right" id="panel">
      <video class="hero-video" id="vid" autoplay muted loop playsinline preload="auto" crossorigin="anonymous">
        <source src="assets/caras_mkof-video.mp4#t=3.5" type="video/mp4">
      </video>
    </div>
  </div>
  <canvas id="cv"></canvas>
<script>
(function(){
  var vid = document.getElementById('vid');
  var cv = document.getElementById('cv');
  var status = document.getElementById('status');
  var FILTER = 'invert(1) sepia(1) saturate(5.2) hue-rotate(52deg) brightness(1.22) contrast(1.08)';
  var DARK = '#0E2B22';

  document.getElementById('btnPng').addEventListener('click', function(){
    try {
      var w = vid.videoWidth || 1280;
      var h = vid.videoHeight || 720;
      cv.width = w;
      cv.height = h;
      var ctx = cv.getContext('2d');
      ctx.fillStyle = DARK;
      ctx.fillRect(0, 0, w, h);
      ctx.filter = FILTER;
      ctx.globalCompositeOperation = 'screen';
      ctx.drawImage(vid, 0, 0, w, h);
      ctx.globalCompositeOperation = 'source-over';
      ctx.filter = 'none';
      var a = document.createElement('a');
      a.download = 'mkof-caras-banner-v4.png';
      a.href = cv.toDataURL('image/png');
      a.click();
      status.textContent = 'PNG descargado (frame actual + filtro lima v4).';
    } catch (err) {
      status.textContent = 'No se pudo exportar PNG (el video remoto a veces bloquea canvas). Usa captura de pantalla de esta página.';
    }
  });
})();
</script>
</body>
</html>
