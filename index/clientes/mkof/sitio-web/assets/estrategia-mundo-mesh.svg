<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" fill="none" role="img" aria-label="Estrategia · mundo Making Of">
  <defs>
    <!-- Misma firma que caras-mesh (V5 / banner verde) -->
    <radialGradient id="meshBg" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#F7F2E4"/>
      <stop offset="100%" stop-color="#D8D3A4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="globeFill" cx="36%" cy="30%" r="72%">
      <stop offset="0%" stop-color="#6BA894"/>
      <stop offset="42%" stop-color="#2A5A49"/>
      <stop offset="100%" stop-color="#091914"/>
    </radialGradient>
    <linearGradient id="globeRim" x1="120" y1="70" x2="400" y2="350">
      <stop offset="0%" stop-color="#C8C28A"/>
      <stop offset="45%" stop-color="#56742A"/>
      <stop offset="100%" stop-color="#133429"/>
    </linearGradient>
    <linearGradient id="landSoft" x1="200" y1="120" x2="340" y2="300">
      <stop offset="0%" stop-color="#99EADA" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#418870" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#091914" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#091914" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="520" height="420" fill="url(#meshBg)"/>

  <!-- Malla de puntos (misma densidad / estilo que caras) -->
  <g fill="#56742A" fill-opacity="0.28">
    <circle cx="260" cy="72" r="3"/>
    <circle cx="210" cy="100" r="2.5"/><circle cx="310" cy="98" r="2.5"/>
    <circle cx="170" cy="155" r="2.2"/><circle cx="350" cy="150" r="2.2"/>
    <circle cx="150" cy="220" r="2.4"/><circle cx="370" cy="215" r="2.4"/>
    <circle cx="185" cy="285" r="2.2"/><circle cx="335" cy="280" r="2.2"/>
    <circle cx="230" cy="330" r="2.5"/><circle cx="290" cy="328" r="2.5"/>
    <circle cx="260" cy="355" r="2.8"/>
  </g>

  <!-- Conexiones suaves hacia el nodo (como caras) -->
  <g stroke="#418870" stroke-opacity="0.55" stroke-width="1.6" fill="none">
    <path d="M210 100 C230 150 245 175 260 210"/>
    <path d="M310 98 C290 150 275 175 260 210"/>
    <path d="M170 155 C205 175 235 195 260 210"/>
    <path d="M350 150 C315 175 285 195 260 210"/>
    <path d="M150 220 C190 215 230 212 260 210"/>
    <path d="M370 215 C330 212 290 210 260 210"/>
    <path d="M260 210 L260 355"/>
  </g>

  <!-- Mundo -->
  <g filter="url(#soft)">
    <!-- Esfera -->
    <circle cx="260" cy="210" r="118" fill="url(#globeFill)"/>
    <circle cx="260" cy="210" r="118" fill="none" stroke="url(#globeRim)" stroke-width="2" stroke-opacity="0.45"/>

    <!-- Brillo suave -->
    <ellipse cx="220" cy="165" rx="48" ry="32" fill="#FBF6EB" fill-opacity="0.12"/>

    <!-- Continentes suaves (manchas orgánicas, no mapa literal) -->
    <path fill="url(#landSoft)" d="
      M210 145
      C235 130 270 135 285 155
      C300 175 295 200 275 210
      C255 220 230 215 215 195
      C200 175 195 158 210 145 Z"/>
    <path fill="#133429" fill-opacity="0.28" d="
      M245 235
      C270 228 300 240 310 265
      C318 288 300 305 275 300
      C250 295 235 275 238 255
      C240 242 245 235 245 235 Z"/>
    <path fill="#99EADA" fill-opacity="0.14" d="
      M195 250
      C210 245 225 255 228 275
      C230 292 215 300 200 295
      C185 290 182 265 195 250 Z"/>

    <!-- Meridianos / paralelos (lectura clara de globo) -->
    <g stroke="#F7F2E4" stroke-opacity="0.28" stroke-width="1.5" fill="none">
      <!-- ecuador -->
      <ellipse cx="260" cy="210" rx="116" ry="34"/>
      <!-- tropicos -->
      <ellipse cx="260" cy="168" rx="100" ry="22"/>
      <ellipse cx="260" cy="252" rx="100" ry="22"/>
      <!-- meridianos -->
      <ellipse cx="260" cy="210" rx="42" ry="116"/>
      <path d="M260 92 C310 130 330 170 330 210 C330 250 310 290 260 328"/>
      <path d="M260 92 C210 130 190 170 190 210 C190 250 210 290 260 328"/>
    </g>
  </g>

  <!-- Puntos sobre el mundo (nodos) -->
  <g>
    <circle cx="230" cy="155" r="3.2" fill="#F7F2E4" fill-opacity="0.55"/>
    <circle cx="290" cy="170" r="2.8" fill="#99EADA" fill-opacity="0.7"/>
    <circle cx="215" cy="210" r="2.6" fill="#C8C28A" fill-opacity="0.65"/>
    <circle cx="305" cy="225" r="3" fill="#F7F2E4" fill-opacity="0.45"/>
    <circle cx="250" cy="265" r="2.8" fill="#99EADA" fill-opacity="0.55"/>
    <circle cx="280" cy="250" r="2.4" fill="#EBE9C2" fill-opacity="0.5"/>
  </g>

  <!-- Nodo central (misma firma mint que caras) -->
  <circle cx="260" cy="210" r="10" fill="#091914"/>
  <circle cx="260" cy="210" r="5" fill="#99EADA"/>
</svg>
