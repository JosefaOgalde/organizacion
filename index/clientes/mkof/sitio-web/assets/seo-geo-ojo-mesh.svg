    <ellipse cx="260" cy="210" rx="52" ry="52" fill="none" stroke="#F7F2E4" stroke-opacity="0.22" stroke-width="1.4"/>
    <ellipse cx="260" cy="210" rx="28" ry="28" fill="none" stroke="#99EADA" stroke-opacity="0.3" stroke-width="1.4"/>
