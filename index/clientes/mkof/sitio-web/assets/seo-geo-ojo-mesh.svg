  </defs>
  <rect width="520" height="420" fill="url(#meshBg)"/>
  <g fill="#56742A" fill-opacity="0.28">
    <circle cx="260" cy="80" r="3"/><circle cx="200" cy="110" r="2.5"/><circle cx="320" cy="108" r="2.5"/>
