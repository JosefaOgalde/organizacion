  <!-- pupil + nodo mint (firma caras) -->
  <circle cx="260" cy="210" r="22" fill="#091914"/>
  <circle cx="260" cy="210" r="10" fill="#091914"/>
  <circle cx="260" cy="210" r="5" fill="#99EADA"/>
