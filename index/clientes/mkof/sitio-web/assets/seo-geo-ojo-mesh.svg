    <circle cx="170" cy="290" r="2.2"/><circle cx="350" cy="285" r="2.2"/>
    <circle cx="260" cy="340" r="2.8"/>
  </g>
  <g stroke="#418870" stroke-opacity="0.5" stroke-width="1.55" fill="none">
    <path d="M200 110 C225 160 240 185 260 210"/>
    <path d="M320 108 C295 160 280 185 260 210"/>
    <path d="M150 180 C195 195 230 205 260 210"/>
    <path d="M370 175 C325 195 290 205 260 210"/>
    <path d="M260 210 L260 340"/>
