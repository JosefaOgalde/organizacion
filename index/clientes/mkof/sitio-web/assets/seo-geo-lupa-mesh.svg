<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" fill="none" role="img" aria-label="SEO y GEO · lupa Making Of">
  <defs>
    <radialGradient id="meshBg" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#F7F2E4"/>
      <stop offset="100%" stop-color="#D8D3A4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glassFill" cx="36%" cy="28%" r="72%">
      <stop offset="0%" stop-color="#6BA894"/>
      <stop offset="42%" stop-color="#2A5A49"/>
      <stop offset="100%" stop-color="#091914"/>
    </radialGradient>
    <linearGradient id="rimFill" x1="80" y1="40" x2="360" y2="300">
      <stop offset="0%" stop-color="#C8C28A"/>
      <stop offset="45%" stop-color="#56742A"/>
      <stop offset="100%" stop-color="#133429"/>
    </linearGradient>
    <linearGradient id="handleFill" x1="300" y1="240" x2="470" y2="390">
      <stop offset="0%" stop-color="#C8C28A"/>
      <stop offset="40%" stop-color="#56742A"/>
      <stop offset="100%" stop-color="#133429"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#091914" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="520" height="420" fill="url(#meshBg)"/>

  <!-- Malla de puntos (firma caras / mundo) -->
  <g fill="#56742A" fill-opacity="0.28">
    <circle cx="260" cy="68" r="3"/>
    <circle cx="190" cy="100" r="2.5"/><circle cx="330" cy="96" r="2.5"/>
    <circle cx="145" cy="175" r="2.2"/><circle cx="380" cy="160" r="2.2"/>
    <circle cx="155" cy="280" r="2.2"/><circle cx="400" cy="250" r="2.2"/>
    <circle cx="230" cy="350" r="2.5"/><circle cx="320" cy="345" r="2.5"/>
    <circle cx="260" cy="372" r="2.8"/>
  </g>
  <g stroke="#418870" stroke-opacity="0.55" stroke-width="1.6" fill="none">
    <path d="M190 100 C215 145 230 175 248 198"/>
    <path d="M330 96 C305 145 275 175 248 198"/>
    <path d="M145 175 C185 185 220 194 248 198"/>
    <path d="M380 160 C330 175 285 190 248 198"/>
    <path d="M248 198 L260 350"/>
  </g>

  <g filter="url(#soft)">
    <!-- Aro -->
    <circle cx="232" cy="188" r="108" fill="none" stroke="url(#rimFill)" stroke-width="22"/>
    <!-- Cristal -->
    <circle cx="232" cy="188" r="96" fill="url(#glassFill)"/>
    <ellipse cx="200" cy="152" rx="38" ry="24" fill="#FBF6EB" fill-opacity="0.14"/>
    <!-- Malla interior del cristal -->
    <g stroke="#F7F2E4" stroke-opacity="0.22" stroke-width="1.3" fill="none">
      <path d="M175 155 L215 128 L255 148 L268 188 L240 220 L198 210 L170 178 Z"/>
      <path d="M198 168 L232 148 L258 182"/>
      <path d="M215 135 L228 188 L208 215"/>
    </g>
    <!-- Virola + mango -->
    <path d="M292 248 L328 282 L314 296 L278 262 Z" fill="#133429" fill-opacity="0.55"/>
    <path d="M318 272 L455 392 L430 412 L296 294 Z" fill="url(#handleFill)"/>
    <g stroke="#F7F2E4" stroke-opacity="0.28" stroke-width="2">
      <path d="M330 292 L352 312"/>
      <path d="M348 308 L370 328"/>
      <path d="M366 324 L388 344"/>
      <path d="M384 340 L406 360"/>
    </g>
    <ellipse cx="448" cy="408" rx="16" ry="12" transform="rotate(42 448 408)" fill="#091914"/>
  </g>

  <!-- Nodos sobre el cristal -->
  <circle cx="198" cy="138" r="2.8" fill="#F7F2E4" fill-opacity="0.5"/>
  <circle cx="268" cy="148" r="2.5" fill="#99EADA" fill-opacity="0.6"/>
  <circle cx="218" cy="210" r="2.4" fill="#C8C28A" fill-opacity="0.55"/>
  <circle cx="252" cy="188" r="2.6" fill="#F7F2E4" fill-opacity="0.45"/>
  <!-- Nodo mint central (firma caras) -->
  <circle cx="232" cy="188" r="10" fill="#091914"/>
  <circle cx="232" cy="188" r="5" fill="#99EADA"/>
</svg>
