<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estrategia · solo mundo · MKOF</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: "Instrument Sans", system-ui, sans-serif;
      color: #fbf6eb;
      background: #091914;
    }
    a { color: #99eada; }
    .top {
      padding: 1rem 1.25rem;
      font-size: 0.85rem;
    }
    .top h1 {
      margin: 0.35rem 0 0.2rem;
      font-size: 1.15rem;
      color: #fbf6eb;
    }
    .top p {
      margin: 0;
      color: rgba(251,246,235,0.7);
      max-width: 36rem;
      line-height: 1.45;
      font-size: 0.9rem;
    }
    /* Banner verde · misma vibra que caras-banner-verde */
    .banner {
      margin: 1rem clamp(1rem, 4vw, 3rem) 2.5rem;
      border-radius: 1.5rem;
      overflow: hidden;
      background:
        radial-gradient(ellipse 80% 70% at 20% 15%, rgba(251,246,235,0.14), transparent 55%),
        linear-gradient(165deg, #2a5a49 0%, #133429 48%, #091914 100%);
      box-shadow: 0 22px 50px rgba(0,0,0,0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: min(72vh, 32rem);
      padding: 1.5rem;
    }
    .banner img {
      width: min(100%, 34rem);
      height: auto;
      display: block;
      filter: drop-shadow(0 12px 28px rgba(0,0,0,0.3));
    }
  </style>
</head>
<body>
  <header class="top">
    <a href="./">← Sitio web MKOF</a>
    <h1>Estrategia · solo mundo</h1>
    <p>Misma estética que las caras del banner verde (líneas, puntos, verdes, nodo mint). Solo el globo.</p>
  </header>

  <section class="banner" aria-label="Mundo Estrategia">
    <img src="assets/estrategia-mundo-mesh.svg?v=2" alt="Mundo Estrategia Making Of" width="520" height="420">
  </section>
</body>
</html>
