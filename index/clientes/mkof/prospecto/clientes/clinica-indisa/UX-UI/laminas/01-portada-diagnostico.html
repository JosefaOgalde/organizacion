<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>Portada diagnóstico web</title><style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{width:1920px;height:1080px;background:#f4f1ea;font-family:Montserrat,system-ui,sans-serif;color:#1a4d3e;padding:52px 64px;position:relative;overflow:hidden}
h1{font-size:44px;font-weight:800;letter-spacing:.04em;color:#1a4d3e}
.sub{font-size:22px;font-weight:600;color:#6a8f7a;margin-top:8px;letter-spacing:.06em}
.foot{position:absolute;bottom:28px;left:0;right:0;text-align:center;font-size:12px;color:#b0b8b2}
.box{background:#1a4d3e;color:#d8f0a8;border-radius:22px;padding:28px 32px}
.box h2{font-size:26px;font-weight:800;color:#c6e86a;margin-bottom:14px}
.box p,.box li{font-size:20px;line-height:1.45;color:#e8f5d0;font-weight:600}
.pill{background:#2f6b52;color:#fff;border-radius:999px;padding:14px 28px;font-weight:700;font-size:16px;letter-spacing:.04em}
.rec{background:#3d6b4f;color:#fff;border-radius:18px;padding:22px 20px;font-size:17px;font-weight:600;line-height:1.4}
.rec b{font-weight:800}
.cap{background:#2f6b52;color:#c6e86a;border-radius:999px;padding:16px 36px;font-size:22px;font-weight:800;letter-spacing:.04em;display:inline-block}
.num{font-size:48px;font-weight:800;color:#1a4d3e}
.wedge{height:28px;background:linear-gradient(90deg,#c6e86a 0%,#2f6b52 100%);border-radius:0 14px 14px 0;position:relative;width:420px}
.pin{position:absolute;top:-10px;width:18px;height:48px;background:#1a4d3e;border-radius:4px;transform:translateX(-50%)}
.metric-row{display:flex;align-items:center;gap:18px;margin:14px 0}
.icon-circle{width:64px;height:64px;border-radius:50%;background:#d8ecd8;display:grid;place-items:center;font-size:28px;flex-shrink:0}
</style></head><body>
  <div style="display:flex;height:920px;gap:48px">
    <div style="flex:1;display:flex;flex-direction:column;justify-content:center">
      <h1>DIAGNÓSTICO WEB</h1>
      <div class="sub">DESKTOP / MOBILE</div>
      <div style="margin-top:72px;font-size:36px;font-weight:800;color:#1a4d3e;letter-spacing:.08em">CLÍNICA INDISA</div>
      <div style="margin-top:12px;font-size:22px;font-weight:600;color:#6a8f7a">www.indisa.cl</div>
    </div>
    <div style="width:420px;display:flex;flex-direction:column;gap:14px;justify-content:center">
      <div class="pill" style="text-align:center">RENDIMIENTO / ACCESIBILIDAD</div><div class="pill" style="text-align:center">USABILIDAD</div><div class="pill" style="text-align:center">JERARQUÍA DE CONTENIDOS</div><div class="pill" style="text-align:center">GENERACIÓN DE CONTENIDOS</div><div class="pill" style="text-align:center">ARQUITECTURA</div><div class="pill" style="text-align:center">REFERENCIAS</div><div class="pill" style="text-align:center">RECOMENDACIONES</div>
    </div>
  </div>
<div class="foot">Created & Proprietary MKOF 2025 / All rights reserved</div></body></html>
