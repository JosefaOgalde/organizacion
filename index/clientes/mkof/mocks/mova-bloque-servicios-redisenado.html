<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MOVA · Bloque servicios — mock</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --teal-deep: #2a4a4e;
      --teal-mid: #4a7a80;
      --bg: #f4fafb;
      --ink: #1f2328;
      --line: #d0d7de;
      --lime: #c6e86a;
      --white: #ffffff;
      --card: #ffffff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      font-family: "DM Sans", system-ui, sans-serif;
      color: var(--ink);
    }
    .frame {
      width: min(980px, 96vw);
      padding: 2.75rem 2rem 3rem;
      background:
        radial-gradient(900px 360px at 100% 0%, rgba(74, 122, 128, 0.14), transparent 55%),
        radial-gradient(700px 280px at 0% 100%, rgba(198, 232, 106, 0.1), transparent 50%),
        var(--bg);
    }
    .band {
      max-width: 720px;
      margin: 0 auto 1.75rem;
      background: linear-gradient(135deg, var(--teal-deep), var(--teal-mid));
      color: #fff;
      border-radius: 12px;
      padding: 1rem 1.4rem;
      font-size: 1.15rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.7rem;
      letter-spacing: -0.01em;
    }
    .band i {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--lime);
      display: inline-block;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 1.1rem;
      max-width: 860px;
      margin: 0 auto;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      min-height: 168px;
      padding: 1.35rem 1rem 1.2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.85rem;
      box-shadow: 0 8px 24px rgba(42, 74, 78, 0.05);
      transition: none;
    }
    .icon-wrap {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      background: linear-gradient(145deg, var(--teal-deep), var(--teal-mid));
      display: grid;
      place-items: center;
      position: relative;
    }
    .icon-wrap::after {
      content: "";
      position: absolute;
      right: -3px;
      bottom: -3px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--lime);
      border: 2px solid var(--white);
    }
    .icon-wrap svg {
      width: 30px;
      height: 30px;
      stroke: #fff;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .card h3 {
      margin: 0;
      font-size: 1.12rem;
      font-weight: 700;
      color: var(--teal-deep);
      letter-spacing: -0.02em;
    }
    .row2 {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 240px));
      justify-content: center;
      gap: 1.1rem;
    }
  </style>
</head>
<body>
  <div class="frame" id="capture">
    <div class="band"><i></i> Te acompañamos en:</div>

    <div class="grid">
      <article class="card">
        <div class="icon-wrap" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M2 20V10l8-6 8 6v10"/><path d="M9 20v-6h6v6"/><path d="M14 4l6 2v3"/></svg>
        </div>
        <h3>Definir</h3>
      </article>

      <article class="card">
        <div class="icon-wrap" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M4 20l9-9"/><path d="M14 4l6 6"/><path d="M11 7l6 6"/><path d="M4 20h4"/><circle cx="18.5" cy="5.5" r="1.4" fill="#c6e86a" stroke="none"/></svg>
        </div>
        <h3>Crear</h3>
      </article>

      <article class="card">
        <div class="icon-wrap" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9h-9V3z"/><path d="M14 3.2A9 9 0 0 1 20.8 10H14V3.2z"/><circle cx="7" cy="17" r="1" fill="#fff" stroke="none"/><circle cx="10.5" cy="18.5" r="1" fill="#fff" stroke="none"/><circle cx="14" cy="17.5" r="1" fill="#fff" stroke="none"/></svg>
        </div>
        <h3>Analizar</h3>
      </article>

      <div class="row2">
        <article class="card">
          <div class="icon-wrap" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M4 19h16"/><path d="M7 16V10"/><path d="M12 16V7"/><path d="M17 16v-4"/><path d="M9 5l3-2 3 2"/></svg>
          </div>
          <h3>Posicionar</h3>
        </article>

        <article class="card">
          <div class="icon-wrap" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M6 3h9l3 3v15H6z"/><path d="M15 3v4h4"/><path d="M9 13h6"/><path d="M9 17h4"/><path d="M9 9l2 2 3-3"/></svg>
          </div>
          <h3>Identificar</h3>
        </article>
      </div>
    </div>
  </div>
</body>
</html>
