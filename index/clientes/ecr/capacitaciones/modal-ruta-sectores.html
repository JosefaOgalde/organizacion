<!--
  ECR Capacitaciones — Modal ruta de aprendizaje por sector
  Pegar este bloque completo en Elementor (HTML personalizado) o en la página.

  Requisitos en las cards:
  - Contenedor con data-ecr-sector="retail|financiero|salud|tecnologia|gestion|logistica|datos|soluciones-in-company"
  - Clase opcional .ecr-sector-card en la card
  - Botón/enlace opcional .ecr-sector-ver-mas

  Links fuente: links-sectores-cursos.txt
-->
<style>
/* ECR Capacitaciones — modal ruta de aprendizaje (compacto, sin scroll) */

.ecr-sector-card {
    cursor: pointer;
    transition: box-shadow 0.2s ease, outline 0.2s ease;
}

.ecr-sector-card:hover,
.ecr-sector-card.ecr-sector-card--activa {
    outline: 3px solid #e85d04;

}

}

.ecr-ruta-modal {
    position: fixed;

    z-index: 999999;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 0.75rem;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity 0.28s ease, visibility 0.28s ease;
}

.ecr-ruta-modal.ecr-ruta-modal--abierto {
    display: flex !important;
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
}

.ecr-ruta-modal__backdrop {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.45);
    cursor: pointer;
}

.ecr-ruta-modal__panel {
    position: relative;
    z-index: 1;
    width: min(640px, 100%);
    max-height: min(92vh, 100%);
    overflow: hidden;
    border-radius: 16px;

    -webkit-backdrop-filter: blur(6px);

    transition: transform 0.28s ease;

}

.ecr-ruta-modal--abierto .ecr-ruta-modal__panel {

}

.ecr-ruta-modal__cerrar {
    position: absolute;

<script>
(function () {
    var modalEl = null;
    var ultimoFoco = null;

    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function crearModal() {
        if (document.getElementById('ecr-ruta-modal')) {
            modalEl = document.getElementById('ecr-ruta-modal');
            return;
        }
        modalEl = document.createElement('div');
        modalEl.id = 'ecr-ruta-modal';
        modalEl.className = 'ecr-ruta-modal';
        modalEl.setAttribute('aria-hidden', 'true');
        modalEl.innerHTML =
            '<div class="ecr-ruta-modal__backdrop" data-ecr-cerrar-modal></div>' +
            '<div class="ecr-ruta-modal__panel" role="dialog" aria-modal="true">' +
            '  <button type="button" class="ecr-ruta-modal__cerrar" data-ecr-cerrar-modal aria-label="Cerrar">&times;</button>' +
            '  <div class="ecr-ruta-modal__contenido"></div></div>';
        document.body.appendChild(modalEl);
        modalEl.addEventListener('click', function (e) {
            if (e.target.closest('[data-ecr-cerrar-modal]')) cerrarModal();
        });
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape' && modalEl && modalEl.classList.contains('ecr-ruta-modal--abierto')) cerrarModal();
        });
    }

    function renderContenido(sector) {
        var cursosHtml = (sector.cursos || []).map(function (c) {
            return '<li class="ecr-ruta-modal__item"><span class="ecr-ruta-modal__item-nombre">' + escapeHtml(c.nombre) + '</span>' +
                '<a class="ecr-ruta-modal__curso-btn" href="' + escapeHtml(c.url || '#') + '" target="_blank" rel="noopener">Ir al curso <span aria-hidden="true">→</span></a></li>';
        }).join('');
        return '<h2 class="ecr-ruta-modal__titulo">' + escapeHtml(sector.titulo) + '</h2>' +
            '<p class="ecr-ruta-modal__subtitulo">' + escapeHtml(sector.subtitulo) + '</p>' +
            '<p class="ecr-ruta-modal__descripcion">' + escapeHtml(sector.descripcion) + '</p>' +
            '<p class="ecr-ruta-modal__competencias">' + escapeHtml(sector.competencias) + '</p>' +
            '<h3 class="ecr-ruta-modal__ruta-titulo">Ruta de aprendizaje:</h3>' +
            '<ol class="ecr-ruta-modal__lista">' + cursosHtml + '</ol>';
    }

    function abrirModal(slug) {
        var data = window.ECR_SECTORES && window.ECR_SECTORES[slug];
        if (!data) return;
        crearModal();
        ultimoFoco = document.activeElement;
        var panel = modalEl.querySelector('.ecr-ruta-modal__panel');
        var nCursos = (data.cursos && data.cursos.length) || 0;
        if (panel) {
            if (nCursos >= 7) panel.classList.add('ecr-ruta-modal__panel--largo');
            else panel.classList.remove('ecr-ruta-modal__panel--largo');
        }
        modalEl.querySelector('.ecr-ruta-modal__contenido').innerHTML = renderContenido(data);
        modalEl.setAttribute('aria-hidden', 'false');
        modalEl.classList.add('ecr-ruta-modal--abierto');
        document.body.classList.add('ecr-ruta-modal-abierto');
    }

    function cerrarModal() {
        if (!modalEl) return;
        modalEl.classList.remove('ecr-ruta-modal--abierto');
        modalEl.setAttribute('aria-hidden', 'true');
        document.body.classList.remove('ecr-ruta-modal-abierto');
        if (ultimoFoco) ultimoFoco.focus();
    }

    document.addEventListener('click', function (e) {
        var verMas = e.target.closest('.ecr-sector-ver-mas');
        var card = e.target.closest('[data-ecr-sector]');
        if (verMas) {
            var cont = verMas.closest('[data-ecr-sector]');
            if (cont) { e.preventDefault(); abrirModal(cont.getAttribute('data-ecr-sector')); }
            return;
        }
        if (card && !e.target.closest('a[href]') && !e.target.closest('.ecr-ruta-modal')) {
            e.preventDefault();
            abrirModal(card.getAttribute('data-ecr-sector'));
        }
    });

    window.ECR = window.ECR || {};
    window.ECR.abrirRutaSector = abrirModal;
    window.ECR.cerrarRutaModal = cerrarModal;
    crearModal();
})();
</script>
